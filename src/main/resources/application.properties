server.port=${SERVER_PORT}
springdoc.swagger-ui.path=/swagger

# === MySQL ===
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# === JWT ===
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-mee}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# === Stripe ===
stripe.secret-key=${STRIPE_SECRET_KEY}

# === Frontend base URL ===
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
